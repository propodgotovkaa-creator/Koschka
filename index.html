<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Где мышка?</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #ddd;
}

/* =========================
   ИГРОВОЕ ПОЛЕ
========================= */

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background-image: url("fon.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* =========================
   СЧЁТЧИК
========================= */

#roundCounter {
    position: absolute;

    top: 24px;
    left: 28px;

    z-index: 100;

    padding: 10px 18px;

    border-radius: 20px;

    background: rgba(255,255,255,0.86);

    font-size: 22px;
    font-weight: 700;

    color: #674629;

    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}

/* =================================================
   КОШКА
================================================= */

#cat {
    position: absolute;

    right: 4%;
    bottom: 11%;

    width: min(28vw, 420px);

    aspect-ratio: 1 / 1.35;

    z-index: 20;
}

/* ТЕЛО */

#catBody {
    position: absolute;

    width: 100%;
    height: auto;

    left: 0;
    bottom: 0;

    z-index: 3;

    pointer-events: none;
}

/* =========================
   ХВОСТ
========================= */

#catTail {
    position: absolute;

    width: 47%;

    height: auto;

    /*
       Это место мы почти наверняка
       немного подвинем после просмотра
       на реальном фоне.
    */

    right: -7%;
    bottom: 7%;

    z-index: 2;

    transform-origin: 25% 88%;

    animation: tailWag 2.7s ease-in-out infinite;

    pointer-events: none;
}

@keyframes tailWag {

    0% {
        transform: rotate(-7deg);
    }

    25% {
        transform: rotate(5deg);
    }

    50% {
        transform: rotate(10deg);
    }

    75% {
        transform: rotate(2deg);
    }

    100% {
        transform: rotate(-7deg);
    }

}

/* =========================
   ЗАКРЫТЫЕ ГЛАЗА
========================= */

#catEyesClosed {
    position: absolute;

    /*
       Размер и положение глаз
       тоже откалибруем после просмотра.
    */

    width: 53%;

    left: 22%;
    top: 16%;

    z-index: 5;

    opacity: 0;

    pointer-events: none;
}

/* =================================================
   МЫШКА — ПОКА ВРЕМЕННАЯ
================================================= */

#mouse {
    position: absolute;

    width: 90px;
    height: 90px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 72px;

    opacity: 0;

    z-index: 30;

    transition:
        left 0.65s ease,
        top 0.65s ease,
        opacity 0.25s ease,
        transform 0.25s ease;
}

#mouse.visible {
    opacity: 1;
}

/* =================================================
   ШАПКИ — ПОКА ВРЕМЕННЫЕ
================================================= */

#hatsArea {
    position: absolute;

    left: 7%;
    right: 31%;

    bottom: 8%;

    height: 300px;

    z-index: 25;
}

.hat-slot {
    position: absolute;

    width: 180px;
    height: 210px;

    bottom: 0;

    cursor: pointer;

    transition:
        left 0.48s cubic-bezier(.4,0,.2,1),
        transform 0.35s ease;
}

.hat {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 155px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 130px;

    z-index: 4;

    transition: transform 0.4s ease;
}

.hiddenMouse {
    position: absolute;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    font-size: 68px;

    opacity: 0;

    z-index: 2;

    transition: opacity 0.2s ease;
}

.hat-slot.open .hat {
    transform: translateY(-110px);
}

.hat-slot.correct .hiddenMouse {
    opacity: 1;
}

.position-0 {
    left: 3%;
}

.position-1 {
    left: 36%;
}

.position-2 {
    left: 69%;
}

/* =================================================
   КНОПКА
================================================= */

#nextButton {
    position: absolute;

    left: 50%;
    top: 18%;

    transform: translateX(-50%) scale(0.85);

    padding: 16px 30px;

    border: none;
    border-radius: 30px;

    background: #73bd79;

    color: white;

    font-size: 25px;
    font-weight: 700;

    cursor: pointer;

    opacity: 0;
    pointer-events: none;

    z-index: 100;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

#nextButton.show {
    opacity: 1;
    pointer-events: auto;

    transform: translateX(-50%) scale(1);
}

/* =================================================
   ФИНАЛ
================================================= */

#finishScreen {
    position: absolute;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: rgba(255,248,232,0.93);

    z-index: 500;
}

#finishScreen.show {
    display: flex;
}

#finishScreen h1 {
    font-size: 52px;
    margin-bottom: 15px;
}

#finishScreen p {
    font-size: 28px;
}


/* =========================
   МОБИЛЬНЫЕ / УЗКИЕ ЭКРАНЫ
========================= */

@media (max-width: 900px) {

    #cat {
        width: min(32vw, 330px);
        right: 1%;
        bottom: 10%;
    }

    #hatsArea {
        left: 3%;
        right: 28%;
    }

    .hat-slot {
        width: 145px;
    }

    .hat {
        font-size: 105px;
    }

}

</style>
</head>

<body>

<div id="game">

    <div id="roundCounter">
        Раунд 1 / 10
    </div>


    <!-- =============================
         КОШКА
    ============================== -->

    <div id="cat">

        <img
            id="catTail"
            src="cat-tail.png"
            alt=""
            draggable="false"
        >

        <img
            id="catBody"
            src="cat-body.png"
            alt=""
            draggable="false"
        >

        <img
            id="catEyesClosed"
            src="cat-eyes-closed.png"
            alt=""
            draggable="false"
        >

    </div>


    <!-- =============================
         МЫШКА
    ============================== -->

    <div id="mouse">
        🐭
    </div>


    <!-- =============================
         ШАПКИ
    ============================== -->

    <div id="hatsArea">

        <div
            class="hat-slot position-0"
            data-id="0"
        >

            <div class="hiddenMouse">
                🐭
            </div>

            <div class="hat">
                🧢
            </div>

        </div>


        <div
            class="hat-slot position-1"
            data-id="1"
        >

            <div class="hiddenMouse">
                🐭
            </div>

            <div class="hat">
                🧢
            </div>

        </div>


        <div
            class="hat-slot position-2"
            data-id="2"
        >

            <div class="hiddenMouse">
                🐭
            </div>

            <div class="hat">
                🧢
            </div>

        </div>

    </div>


    <button id="nextButton">
        Играть дальше
    </button>


    <div id="finishScreen">

        <h1>
            🎉 Молодец!
        </h1>

        <p>
            Ты нашёл мышку!
        </p>

    </div>

</div>


<script>

/* =================================================
   НАСТРОЙКИ
================================================= */

const TOTAL_ROUNDS = 10;

const rounds = [
    0,
    2,
    1,
    0,
    1,
    2,
    2,
    0,
    1,
    2
];


/* =================================================
   ЭЛЕМЕНТЫ
================================================= */

const game =
    document.getElementById("game");

const mouse =
    document.getElementById("mouse");

const hats =
    [...document.querySelectorAll(".hat-slot")];

const nextButton =
    document.getElementById("nextButton");

const roundCounter =
    document.getElementById("roundCounter");

const finishScreen =
    document.getElementById("finishScreen");

const catEyesClosed =
    document.getElementById("catEyesClosed");


/* =================================================
   СОСТОЯНИЕ
================================================= */

let currentRound = 0;

let mouseHatID = 0;

let canChoose = false;

let roundSolved = false;

let positionMap = [0, 1, 2];


/* =================================================
   WAIT
================================================= */

function wait(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );

}


/* =================================================
   МОРГАНИЕ КОШКИ
================================================= */

async function blinkCat() {

    catEyesClosed.style.opacity = "1";

    await wait(150);

    catEyesClosed.style.opacity = "0";

}


/*
   Моргание происходит
   с немного случайным интервалом,
   чтобы кошка выглядела живее.
*/

function startBlinking() {

    async function blinkLoop() {

        const delay =
            2500 +
            Math.random() * 3500;

        await wait(delay);

        await blinkCat();

        /*
           Иногда двойное моргание
        */

        if (Math.random() < 0.22) {

            await wait(180);

            await blinkCat();

        }

        blinkLoop();

    }

    blinkLoop();

}


/* =================================================
   ПОЗИЦИИ ШАПОК
================================================= */

function updateHatPositions() {

    hats.forEach((hat, hatID) => {

        hat.classList.remove(
            "position-0",
            "position-1",
            "position-2"
        );

        hat.classList.add(
            "position-" + positionMap[hatID]
        );

    });

}


/* =================================================
   ПЕРЕМЕШИВАНИЕ МАССИВА
================================================= */

function shuffleArray(array) {

    const copy = [...array];

    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =================================================
   ШАПКИ ПЕРЕМЕШИВАЮТСЯ
================================================= */

async function shuffleHats() {

    const shuffleSteps = 7;

    for (
        let i = 0;
        i < shuffleSteps;
        i++
    ) {

        let newPositions;

        do {

            newPositions =
                shuffleArray([0,1,2]);

        }
        while (
            newPositions.every(
                (value,index) =>
                    value === positionMap[index]
            )
        );

        positionMap = newPositions;

        updateHatPositions();

        await wait(520);

    }

}


/* =================================================
   ПОКАЗ МЫШКИ
================================================= */

async function showMouseBeforeRound() {

    const rect =
        game.getBoundingClientRect();

    mouse.style.left =
        rect.width * 0.42 + "px";

    mouse.style.top =
        rect.height * 0.38 + "px";

    mouse.classList.add("visible");

    await wait(1500);

}


/* =================================================
   МЫШКА ПРЫГАЕТ В ШАПКУ
================================================= */

async function mouseJumpIntoHat(hatID) {

    const target =
        hats[hatID];

    const targetRect =
        target.getBoundingClientRect();

    const gameRect =
        game.getBoundingClientRect();

    mouse.style.left =
        (
            targetRect.left -
            gameRect.left +
            targetRect.width / 2 -
            45
        ) + "px";

    mouse.style.top =
        (
            targetRect.top -
            gameRect.top +
            80
        ) + "px";

    await wait(650);

    mouse.classList.remove("visible");

    await wait(300);

}


/* =================================================
   НАЧАЛО РАУНДА
================================================= */

async function startRound() {

    canChoose = false;
    roundSolved = false;

    nextButton.classList.remove("show");

    hats.forEach(hat => {

        hat.classList.remove(
            "open",
            "correct"
        );

    });

    positionMap = [0,1,2];

    updateHatPositions();

    roundCounter.textContent =
        `Раунд ${currentRound + 1} / ${TOTAL_ROUNDS}`;

    mouseHatID =
        rounds[currentRound];

    await wait(500);

    await showMouseBeforeRound();

    await mouseJumpIntoHat(
        mouseHatID
    );

    await wait(400);

    await shuffleHats();

    canChoose = true;

}


/* =================================================
   ВЫБОР ШАПКИ
================================================= */

async function chooseHat(hat) {

    if (!canChoose) return;
    if (roundSolved) return;

    if (
        hat.classList.contains("open")
    ) {
        return;
    }

    const hatID =
        Number(hat.dataset.id);

    hat.classList.add("open");


    /*
       НАШЛИ МЫШКУ
    */

    if (hatID === mouseHatID) {

        roundSolved = true;
        canChoose = false;

        hat.classList.add("correct");

        await wait(500);

        nextButton.classList.add("show");

    }


    /*
       МЫШКИ НЕТ
    */

    else {

        await wait(850);

        hat.classList.remove("open");

    }

}


/* =================================================
   КЛИКИ
================================================= */

hats.forEach(hat => {

    hat.addEventListener(
        "click",
        () => chooseHat(hat)
    );

});


/* =================================================
   СЛЕДУЮЩИЙ РАУНД
================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (!roundSolved) return;

        currentRound++;

        if (
            currentRound >= TOTAL_ROUNDS
        ) {

            finishScreen.classList.add(
                "show"
            );

            return;
        }

        await startRound();

    }
);


/* =================================================
   ЗАПУСК
================================================= */

startBlinking();
startRound();

</script>

</body>
</html>
