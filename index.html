<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Где мышка?</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #ddd;
}

/* ================================
   ИГРА
================================ */

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background-image: url("fon.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* ================================
   ВОПРОС
================================ */

#questionText {
    position: absolute;

    left: 43%;
    top: 27%;

    transform:
        translateX(-50%)
        translateY(-10px);

    padding: 13px 27px;

    border-radius: 28px;

    background: rgba(255,255,255,0.90);

    color: #674629;

    font-size: 27px;
    font-weight: 700;

    white-space: nowrap;

    z-index: 110;

    opacity: 0;
    pointer-events: none;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.12);

    transition:
        opacity 0.35s ease,
        transform 0.35s ease;
}

#questionText.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* ================================
   КОШКА
================================ */

#cat {
    position: absolute;

    right: 4%;
    bottom: 15%;

    width: min(28vw, 420px);

    aspect-ratio: 1 / 1.35;

    z-index: 20;

    pointer-events: none;
}

#catBody {
    position: absolute;

    width: 100%;
    height: auto;

    left: 0;
    bottom: 0;

    z-index: 3;
}

#catTail {
    position: absolute;

    width: 47%;
    height: auto;

    right: -7%;
    bottom: 7%;

    z-index: 2;

    transform-origin: 25% 88%;

    animation:
        tailWag 2.7s ease-in-out infinite;
}

@keyframes tailWag {

    0%   { transform: rotate(-7deg); }
    25%  { transform: rotate(5deg); }
    50%  { transform: rotate(10deg); }
    75%  { transform: rotate(2deg); }
    100% { transform: rotate(-7deg); }
}

/* ================================
   МЫШКА
================================ */

#mouse {
    position: absolute;

    width: 105px;

    z-index: 45;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

#mouse img {
    display: block;
    width: 100%;
    height: auto;
}

#mouse.visible {
    opacity: 1;
}

#mouse.appear {
    animation:
        mouseAppear 0.4s ease;
}

@keyframes mouseAppear {

    0% {
        transform: scale(0.65);
    }

    65% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }
}

/* ================================
   ШАПКИ
================================ */

#hatsArea {
    position: absolute;

    left: 19%;
    right: 23%;

    bottom: 15%;

    height: 330px;

    z-index: 30;
}

.hat-slot {
    position: absolute;

    width: 200px;
    height: 245px;

    bottom: 0;

    cursor: pointer;
}

.hat {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    z-index: 5;

    transition:
        transform 0.42s cubic-bezier(.3,.8,.3,1);
}

.hat-image {
    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}

/* ================================
   МЫШКА ПОД ШАПКОЙ
================================ */

.hiddenMouse {
    position: absolute;

    left: 50%;
    bottom: 18px;

    width: 90px;

    transform: translateX(-50%);

    opacity: 0;

    z-index: 3;

    transition:
        opacity 0.22s ease;
}

.hiddenMouse img {
    display: block;
    width: 100%;
    height: auto;
}

.hat-slot.open .hat {
    transform:
        translateY(-122px);
}

.hat-slot.correct .hiddenMouse {
    opacity: 1;
}

/* ================================
   ТРИ ФИКСИРОВАННЫЕ ПОЗИЦИИ
================================ */

.position-0 {
    left: 2%;
}

.position-1 {
    left: 35%;
}

.position-2 {
    left: 68%;
}

/* ================================
   КНОПКА
================================ */

#nextButton {
    position: absolute;

    left: 43%;
    top: 34%;

    transform:
        translateX(-50%)
        scale(0.85);

    padding: 16px 30px;

    border: none;
    border-radius: 32px;

    background: #72bb78;

    color: white;

    font-size: 25px;
    font-weight: 700;

    cursor: pointer;

    opacity: 0;
    pointer-events: none;

    z-index: 120;

    box-shadow:
        0 6px 18px rgba(0,0,0,0.16);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

#nextButton.show {
    opacity: 1;
    pointer-events: auto;

    transform:
        translateX(-50%)
        scale(1);
}

/* ================================
   ШТОРКИ
================================ */

#curtain {
    position: absolute;

    inset: 0;

    z-index: 400;

    pointer-events: none;

    overflow: hidden;
}

.curtainSide {
    position: absolute;

    top: 0;

    width: 51%;
    height: 100%;

    background:
        repeating-linear-gradient(
            90deg,
            #c9574f 0px,
            #d9685e 45px,
            #b94440 90px,
            #d9685e 135px
        );

    box-shadow:
        inset 0 0 40px
        rgba(90,25,20,0.25);

    transition:
        transform 0.72s
        cubic-bezier(.65,0,.35,1);
}

#curtainLeft {
    left: 0;
    transform: translateX(-101%);
}

#curtainRight {
    right: 0;
    transform: translateX(101%);
}

#curtain.closed #curtainLeft {
    transform: translateX(0);
}

#curtain.closed #curtainRight {
    transform: translateX(0);
}

/* ================================
   ФИНАЛ
================================ */

#finishScreen {
    position: absolute;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    background:
        rgba(255,248,232,0.94);

    z-index: 500;
}

#finishScreen.show {
    display: flex;
}

#finishScreen h1 {
    margin-bottom: 15px;
    font-size: 52px;
}

#finishScreen p {
    font-size: 28px;
}

/* ================================
   iPAD
================================ */

@media (max-width: 950px) {

    #cat {
        width: min(31vw, 340px);
        right: 1%;
        bottom: 14%;
    }

    #hatsArea {
        left: 14%;
        right: 20%;
        bottom: 14%;
        height: 280px;
    }

    .hat-slot {
        width: 160px;
        height: 205px;
    }

    .hat-slot.open .hat {
        transform:
            translateY(-95px);
    }

    .hiddenMouse {
        width: 74px;
    }

    #mouse {
        width: 90px;
    }

    #nextButton {
        left: 43%;
        top: 35%;
    }

    #questionText {
        left: 43%;
        top: 27%;
        font-size: 23px;
        padding: 11px 22px;
    }
}

</style>
</head>

<body>

<div id="game">

    <div id="questionText">
        Где спряталась мышка?
    </div>

    <div id="cat">

        <img
            id="catTail"
            src="cat-tail.png"
            draggable="false"
            alt=""
        >

        <img
            id="catBody"
            src="cat-body.png"
            draggable="false"
            alt=""
        >

    </div>

    <div id="mouse">

        <img
            src="mouse.png"
            draggable="false"
            alt=""
        >

    </div>

    <div id="hatsArea"></div>

    <button id="nextButton">
        Играть дальше
    </button>

    <div id="curtain">

        <div
            id="curtainLeft"
            class="curtainSide">
        </div>

        <div
            id="curtainRight"
            class="curtainSide">
        </div>

    </div>

    <div id="finishScreen">

        <h1>🎉 Отлично!</h1>

        <p>
            Ты нашёл мышку!
        </p>

    </div>

</div>

<script>

/* ================================
   КОМПЛЕКТЫ ШАПОК
================================ */

const hatSets = [

    [
        "hats/hat-red-chess-v2.png",
        "hats/hat-1-car.png",
        "hats/hat-red-shower-v3.png"
    ],

    [
        "hats/cherry.png",
        "hats/puck.png",
        "hats/bear.png"
    ],

    [
        "hats/frog.png",
        "hats/tire.png",
        "hats/bag.png"
    ],

    [
        "hats/coat.png",
        "hats/rooster.png",
        "hats/chocolate.png"
    ],

    [
        "hats/cone.png",
        "hats/baby.png",
        "hats/horse.png"
    ]

];

const TOTAL_ROUNDS = 10;


/* ================================
   ГДЕ ПРЯЧЕТСЯ МЫШКА

   0 = левая шапка
   1 = центральная
   2 = правая

   Сделала последовательность
   специально максимально разной.
================================ */

const mousePositions = [

    0, 2,
    1, 0,
    2, 1,
    0, 2,
    1, 0

];


/* ================================
   ЭЛЕМЕНТЫ
================================ */

const game =
    document.getElementById("game");

const hatsArea =
    document.getElementById("hatsArea");

const mouse =
    document.getElementById("mouse");

const nextButton =
    document.getElementById("nextButton");

const questionText =
    document.getElementById("questionText");

const finishScreen =
    document.getElementById("finishScreen");

const curtain =
    document.getElementById("curtain");


/* ================================
   СОСТОЯНИЕ
================================ */

let currentRound = 0;

let mouseHatID = 0;

let canChoose = false;

let roundSolved = false;

let hats = [];


/* ================================
   ПАУЗА
================================ */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


/* ================================
   КОМПЛЕКТ ТЕКУЩЕГО РАУНДА
================================ */

function getCurrentHatSet() {

    const setIndex =
        Math.floor(currentRound / 2);

    return hatSets[setIndex];

}


/* ================================
   СОЗДАЁМ ШАПКИ
================================ */

function createHats() {

    hatsArea.innerHTML = "";


    const currentSet =
        getCurrentHatSet();


    currentSet.forEach(
        (imagePath, index) => {

            const slot =
                document.createElement("div");

            slot.className =
                `hat-slot position-${index}`;

            slot.dataset.id =
                index;


            /* Мышка под шапкой */

            const hiddenMouse =
                document.createElement("div");

            hiddenMouse.className =
                "hiddenMouse";


            const hiddenMouseImage =
                document.createElement("img");

            hiddenMouseImage.src =
                "mouse.png";

            hiddenMouseImage.draggable =
                false;


            hiddenMouse.appendChild(
                hiddenMouseImage
            );


            /* Шапка */

            const hat =
                document.createElement("div");

            hat.className =
                "hat";


            const hatImage =
                document.createElement("img");

            hatImage.src =
                imagePath;

            hatImage.className =
                "hat-image";

            hatImage.draggable =
                false;


            hat.appendChild(
                hatImage
            );


            slot.appendChild(
                hiddenMouse
            );

            slot.appendChild(
                hat
            );


            hatsArea.appendChild(
                slot
            );

        }
    );


    hats =
        [
            ...document.querySelectorAll(
                ".hat-slot"
            )
        ];


    hats.forEach(
        hat => {

            hat.addEventListener(
                "click",
                () => chooseHat(hat)
            );

        }
    );

}


/* ================================
   МЫШКА НА ПОДУШКЕ
================================ */

async function showMouseBeforeRound() {

    const gameRect =
        game.getBoundingClientRect();


    mouse.style.left =
        (
            gameRect.width * 0.14
        ) + "px";


    mouse.style.top =
        (
            gameRect.height * 0.61
        ) + "px";


    mouse.classList.add(
        "visible",
        "appear"
    );


    await wait(400);


    mouse.classList.remove(
        "appear"
    );


    await wait(1100);

}


/* ================================
   ШТОРКА
================================ */

async function closeCurtain() {

    curtain.classList.add(
        "closed"
    );

    await wait(760);

}


async function openCurtain() {

    curtain.classList.remove(
        "closed"
    );

    await wait(760);

}


function hideMouseBehindCurtain() {

    mouse.classList.remove(
        "visible",
        "appear"
    );

}


/* ================================
   НАЧАЛО РАУНДА
================================ */

async function startRound() {

    canChoose = false;

    roundSolved = false;


    questionText
        .classList
        .remove("show");


    nextButton
        .classList
        .remove("show");


    /*
       Новый комплект шапок.
    */

    createHats();


    /*
       Вот здесь теперь выбирается
       конкретная позиция мышки.

       Никакого перемешивания больше нет.
    */

    mouseHatID =
        mousePositions[currentRound];


    await wait(500);


    /* 1. Мышка появилась */

    await showMouseBeforeRound();


    /* 2. Шторка закрылась */

    await closeCurtain();


    /*
       3. За закрытой шторкой
       мышка исчезает.
    */

    hideMouseBehindCurtain();


    await wait(300);


    /* 4. Открываем */

    await openCurtain();


    /*
       5. Показываем вопрос.
    */

    questionText
        .classList
        .add("show");


    /*
       Теперь шапки НЕ двигаются.

       Просто даём ребёнку небольшой
       момент посмотреть на них.
    */

    await wait(900);


    /*
       Вопрос исчезает.
    */

    questionText
        .classList
        .remove("show");


    await wait(150);


    /*
       Можно выбирать.
    */

    canChoose = true;

}


/* ================================
   ВЫБОР
================================ */

async function chooseHat(hat) {

    if (!canChoose) {
        return;
    }

    if (roundSolved) {
        return;
    }

    if (
        hat.classList.contains("open")
    ) {
        return;
    }


    const hatID =
        Number(
            hat.dataset.id
        );


    /*
       Поднимаем шапку.
    */

    hat.classList.add(
        "open"
    );


    /* ПРАВИЛЬНО */

    if (
        hatID === mouseHatID
    ) {

        roundSolved = true;

        canChoose = false;


        hat.classList.add(
            "correct"
        );


        await wait(450);


        nextButton
            .classList
            .add("show");

    }


    /* НЕПРАВИЛЬНО */

    else {

        await wait(900);


        hat.classList.remove(
            "open"
        );

    }

}


/* ================================
   ИГРАТЬ ДАЛЬШЕ
================================ */

nextButton.addEventListener(
    "click",
    async () => {

        if (!roundSolved) {
            return;
        }


        currentRound++;


        if (
            currentRound >=
            TOTAL_ROUNDS
        ) {

            nextButton
                .classList
                .remove("show");


            questionText
                .classList
                .remove("show");


            finishScreen
                .classList
                .add("show");


            return;
        }


        await startRound();

    }
);


/* ================================
   СТАРТ
================================ */

startRound();

</script>

</body>
</html>
